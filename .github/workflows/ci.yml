name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Emacs version
        id: emacs-version
        run: echo "version=$(tr -d '[:space:]' < .emacs-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ steps.emacs-version.outputs.version }}

      - name: Run checks (parens, indent, byte-compile, checkdoc, package-lint, tests)
        run: |
          ./scripts/check-all.sh
